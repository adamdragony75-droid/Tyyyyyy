name: win2025 + tailscale 

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 600  # مدة أطول لتعطيك وقت للمصادقة اليدوية

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 2 -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force
          Write-Host "✅ RDP enabled successfully"

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
              Write-Host "✅ User RDP created"
          }
          
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          Write-Host "✅ RDP user ready"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Write-Host "📥 Downloading Tailscale..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          
          Write-Host "🔧 Installing Tailscale..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Tailscale installed"

      - name: Connect Tailscale — Use Auth Link Below 👇
        run: |
          Write-Host "`n========================================"
          Write-Host "        🔑 المصادقة المطلوبة"
          Write-Host "========================================"
          Write-Host "  انسخ الرابط أدناه وافتحه في متصفحك"
          Write-Host "  سجّل الدخول بحسابك في Tailscale"
          Write-Host "  ثم عد هنا وانتظر اكتمال العملية`n"
          
          # تشغيل Tailscale بدون مفتاح — سيعرض رابط المصادقة
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --hostname=win2025-runner-$env:GITHUB_RUN_ID --unattended
          
          Write-Host "`n⏳ جاري الحصول على عنوان IP..."
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 60) {  # انتظار أطول — دقيقتان كحد أقصى
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if ($tsIP) { break }
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] في انتظار المصادقة... محاولة $retries/60"
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Host "`n⚠️ لم يتم الحصول على عنوان IP بعد."
              Write-Host "✅ لكن لا مشكلة، استخدم رابط المصادقة الظاهر أعلاه"
              Write-Host "بعد المصادقة يدوياً، سيظهر عنوان الـ IP أدناه تلقائياً:`n"
              $tsIP = "قم بتحديث الصفحة أو تحقق من سجلات Tailscale لمعرفة الـ IP"
          } else {
              echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
              Write-Host "`n✅ تم الاتصال بنجاح! عنوان Tailscale IP: $tsIP"
          }

      - name: Show RDP Connection Info
        run: |
          Write-Host "`n========================================"
          Write-Host "          🖥️  بيانات الوصول عبر RDP"
          Write-Host "========================================"
          Write-Host "  العنوان (Tailscale IP): $env:TAILSCALE_IP"
          Write-Host "  اسم المستخدم: RDP"
          Write-Host "  كلمة المرور: MR.English2008"
          Write-Host "========================================`n"

      - name: Maintain Connection
        run: |
          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }
                      
                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "📋 تم نسخ Downloads.bat إلى مجلد بدء التشغيل"
                      
                      cmd /c $downloadPath
                      Write-Host "✅ تم تنفيذ السكربت بنجاح"
                      break
                  }
                  catch {
                      Write-Host "⚠️ خطأ: $($_.Exception.Message)"
                      break
                  }
              }
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] في انتظار ملف تعريف المستخدم RDP..."
              Start-Sleep -Seconds 30
          }

          Write-Host "`n🟢 الخادم جاهز ويعمل! اتصال RDP متاح."
          Write-Host "⏱️ سيبقى نشطاً حتى توقف العملية يدوياً`n"
          
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ يعمل — اتصال RDP نشط"
              Start-Sleep -Seconds 60
          }
          
